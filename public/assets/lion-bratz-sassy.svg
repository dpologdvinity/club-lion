<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <!-- Sassy Diva Gradients -->
    <radialGradient id="bs-fur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed679" />
      <stop offset="60%" stop-color="#e99e2e" />
      <stop offset="100%" stop-color="#bf700c" />
    </radialGradient>
    <radialGradient id="bs-cream" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8e8" />
      <stop offset="100%" stop-color="#f5dab0" />
    </radialGradient>
    <radialGradient id="bs-mane" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f39121" />
      <stop offset="65%" stop-color="#cb5c06" />
      <stop offset="100%" stop-color="#933b00" />
    </radialGradient>
    <!-- Hypnotic Cat Iris: Radiant Sapphire/Cyan with Gold Starburst -->
    <radialGradient id="bs-iris" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#c4f7ff" />
      <stop offset="35%" stop-color="#2ed0ee" />
      <stop offset="70%" stop-color="#0870a4" />
      <stop offset="90%" stop-color="#043c5b" />
      <stop offset="100%" stop-color="#021d2d" />
    </radialGradient>
    <!-- Chunky Gold Cuban Chain -->
    <linearGradient id="bs-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a4" />
      <stop offset="40%" stop-color="#f8c332" />
      <stop offset="80%" stop-color="#c48509" />
      <stop offset="100%" stop-color="#7e4f02" />
    </linearGradient>
    <filter id="bs-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="184" rx="68" ry="11" fill="rgba(45,18,6,0.24)" filter="url(#bs-shadow)" />

  <!-- Sassy Upward-Curving Tail with Attitude -->
  <g class="tail">
    <path d="M136 146 C166 142 190 125 184 94 C180 76 162 76 158 86 C154 96 172 108 166 122 C160 134 146 142 134 144" 
          stroke="url(#bs-fur)" stroke-width="7.5" stroke-linecap="round" fill="none" />
    <!-- Sharp Sculpted Mane Tuft -->
    <path d="M184 86 C195 78 200 62 192 54 C184 46 172 52 166 60 C160 50 148 56 148 66 C146 78 160 90 176 90 Z" 
          fill="url(#bs-mane)" />
    <!-- Hot pink highlight streak in tail tuft -->
    <path d="M178 68 Q186 58 190 62" stroke="#ff3d9a" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M174 72 Q180 64 184 66" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" fill="none" />
  </g>

  <!-- Posed Back Paws (Poised Stance) -->
  <g class="back-paws">
    <ellipse cx="58" cy="168" rx="16" ry="10" fill="url(#bs-fur)" />
    <ellipse cx="142" cy="168" rx="16" ry="10" fill="url(#bs-fur)" />
    <!-- Pedicured Toe Paws -->
    <circle cx="52" cy="169" r="3.2" fill="url(#bs-cream)" />
    <circle cx="58" cy="170" r="3.2" fill="url(#bs-cream)" />
    <circle cx="64" cy="169" r="3.2" fill="url(#bs-cream)" />
    <circle cx="136" cy="169" r="3.2" fill="url(#bs-cream)" />
    <circle cx="142" cy="170" r="3.2" fill="url(#bs-cream)" />
    <circle cx="148" cy="169" r="3.2" fill="url(#bs-cream)" />
  </g>

  <!-- Svelte Body with Confident Arch -->
  <g class="body">
    <path d="M74 116 C60 128 58 156 68 168 C80 178 120 178 132 168 C144 156 142 128 126 116 Z" fill="url(#bs-fur)" />
    <!-- Contoured Waist Highlight -->
    <path d="M86 122 C78 132 78 156 86 166 C94 172 106 172 114 166 C122 156 122 132 114 122 C106 116 94 116 86 122 Z" fill="url(#bs-cream)" />
  </g>

  <!-- Front Paws (One Confidently Stepped Forward) -->
  <g class="front-paws">
    <!-- Left Paw slightly forward -->
    <path d="M80 144 C80 156 78 170 81 176 C84 180 93 180 96 176 C98 170 97 154 95 144 Z" fill="url(#bs-fur)" />
    <circle cx="84" cy="175" r="2.8" fill="url(#bs-cream)" />
    <circle cx="89" cy="176" r="2.8" fill="url(#bs-cream)" />
    <circle cx="94" cy="175" r="2.8" fill="url(#bs-cream)" />
    <!-- Right Paw poised back -->
    <path d="M118 144 C118 156 121 168 118 174 C115 177 106 177 103 174 C101 169 102 154 104 144 Z" fill="url(#bs-fur)" />
    <circle cx="105" cy="173" r="2.8" fill="url(#bs-cream)" />
    <circle cx="110" cy="174" r="2.8" fill="url(#bs-cream)" />
    <circle cx="115" cy="173" r="2.8" fill="url(#bs-cream)" />
  </g>

  <!-- Fierce Sculpted Mane with Sharp Glossy Flicks -->
  <g class="mane">
    <path d="M100 18 
             C132 16 158 26 170 48 
             C182 68 184 96 172 120 
             C162 138 142 150 120 152 
             C112 153 88 153 80 152 
             C58 150 38 138 28 120 
             C16 96 18 68 30 48 
             C42 26 68 16 100 18 Z" 
          fill="url(#bs-mane)" />
    <!-- Spiky / Flicked Mane Silhouette (Bratz Edge) -->
    <path d="M46 42 L26 34 L38 56 L18 58 L32 78 L14 88 L34 104 L20 120 L48 126 Z" fill="url(#bs-mane)" />
    <path d="M154 42 L174 34 L162 56 L182 58 L168 78 L186 88 L166 104 L180 120 L152 126 Z" fill="url(#bs-mane)" />
    <!-- Hot Pink Y2K Accent Streaks -->
    <path d="M48 50 Q28 62 40 78" stroke="#ff3d9a" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M152 50 Q172 62 160 78" stroke="#ff3d9a" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Glossy Specular Highlights -->
    <path d="M60 32 Q100 18 140 32" stroke="#fff0a8" stroke-width="3.8" stroke-linecap="round" fill="none" />
    <path d="M72 38 Q100 26 128 38" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Heavy Gold Cuban Curb Chain Collar with Lion Medallion -->
  <g class="cuban-chain">
    <!-- Curb links -->
    <path d="M74 126 Q100 138 126 126" stroke="url(#bs-gold)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="3.5 1.5" fill="none" />
    <path d="M76 125 Q100 137 124 125" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8" />
    <!-- Oversized Gold Lion Medallion -->
    <g transform="translate(100, 144)">
      <circle cx="0" cy="0" r="7.5" fill="url(#bs-gold)" stroke="#583500" stroke-width="0.8" />
      <circle cx="0" cy="0" r="6" fill="#f8c332" />
      <!-- Mini Lion Head Stamp / Diamond Center -->
      <polygon points="0,-3.5 3,0 0,3.5 -3,0" fill="#ffffff" />
      <!-- Rhinestone glints around rim -->
      <circle cx="-4.5" cy="-2" r="0.7" fill="#ffffff" />
      <circle cx="4.5" cy="-2" r="0.7" fill="#ffffff" />
      <circle cx="0" cy="4.5" r="0.7" fill="#ffffff" />
    </g>
  </g>

  <!-- Head Base -->
  <g class="head">
    <ellipse cx="100" cy="85" rx="46" ry="39" fill="url(#bs-fur)" />

    <!-- Sculpted High Cheekbones & Contouring -->
    <path d="M58 88 Q70 102 84 104" stroke="rgba(110,40,6,0.18)" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <path d="M142 88 Q130 102 116 104" stroke="rgba(110,40,6,0.18)" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <!-- Blinding Strobing Highlighter on Cheekbones -->
    <ellipse cx="62" cy="89" rx="4" ry="1.6" fill="#ffffff" opacity="0.65" transform="rotate(-15 62 89)" />
    <ellipse cx="138" cy="89" rx="4" ry="1.6" fill="#ffffff" opacity="0.65" transform="rotate(15 138 89)" />
    <!-- Sunkissed Terracotta Blush -->
    <ellipse cx="66" cy="95" rx="8" ry="4.5" fill="#ea5b42" opacity="0.3" />
    <ellipse cx="134" cy="95" rx="8" ry="4.5" fill="#ea5b42" opacity="0.3" />

    <!-- Ears with Gold Piercing Hoops -->
    <g class="ears">
      <!-- Left Ear -->
      <circle cx="56" cy="48" r="14" fill="url(#bs-fur)" />
      <circle cx="56" cy="48" r="8.5" fill="#e88572" opacity="0.85" />
      <!-- Gold Double Piercing Hoops in ear tip -->
      <circle cx="46" cy="42" r="2.8" stroke="url(#bs-gold)" stroke-width="1.2" fill="none" />
      <circle cx="50" cy="38" r="2.8" stroke="url(#bs-gold)" stroke-width="1.2" fill="none" />
      <!-- Right Ear -->
      <circle cx="144" cy="48" r="14" fill="url(#bs-fur)" />
      <circle cx="144" cy="48" r="8.5" fill="#e88572" opacity="0.85" />
    </g>

    <!-- Sassy Side-Eye Feline Almond Eyes with Dramatic Wings -->
    <g class="sassy-eyes">
      <!-- Arched Sassy High Eyebrows -->
      <path d="M56 64 C64 57 78 59 86 66" stroke="#481c04" stroke-width="2.6" stroke-linecap="round" fill="none" />
      <path d="M144 67 C136 61 122 61 114 67" stroke="#481c04" stroke-width="2.6" stroke-linecap="round" fill="none" />

      <!-- Left Eye (Looking Sassy Right/Viewer) -->
      <!-- Sclera -->
      <path d="M58 81 C62 68 84 68 90 80 C84 92 62 92 58 81 Z" fill="#ffffff" />
      <!-- Iris shifted toward center for side-eye smirk -->
      <ellipse cx="76" cy="80.5" rx="10.5" ry="12" fill="url(#bs-iris)" />
      <!-- Slit/Almond Pupil -->
      <ellipse cx="77" cy="80.5" rx="5" ry="8" fill="#031622" />
      <!-- Glints -->
      <ellipse cx="74" cy="75" rx="4" ry="4.5" fill="#ffffff" />
      <circle cx="81" cy="85" r="1.5" fill="#ffffff" />
      <!-- Dramatic Extended Winged Eyeliner -->
      <path d="M54 81 C60 66 84 65 96 76" stroke="#120601" stroke-width="3.8" stroke-linecap="round" fill="none" />
      <path d="M92 72 L101 64" stroke="#120601" stroke-width="2.6" stroke-linecap="round" />
      <!-- Inner Tear Duct Cat Flick -->
      <polygon points="55,81 52,83 55,83" fill="#120601" />
      <!-- Spidery Lower Doll Lashes -->
      <path d="M64 90 L62 94 M74 91 L73 95.5 M82 89 L84 93" stroke="#120601" stroke-width="1.5" stroke-linecap="round" />

      <!-- Right Eye -->
      <path d="M142 81 C138 68 116 68 110 80 C116 92 138 92 142 81 Z" fill="#ffffff" />
      <ellipse cx="124" cy="80.5" rx="10.5" ry="12" fill="url(#bs-iris)" />
      <ellipse cx="125" cy="80.5" rx="5" ry="8" fill="#031622" />
      <ellipse cx="122" cy="75" rx="4" ry="4.5" fill="#ffffff" />
      <circle cx="129" cy="85" r="1.5" fill="#ffffff" />
      <!-- Winged Liner -->
      <path d="M146 81 C140 66 116 65 104 76" stroke="#120601" stroke-width="3.8" stroke-linecap="round" fill="none" />
      <path d="M108 72 L99 64" stroke="#120601" stroke-width="2.6" stroke-linecap="round" />
      <polygon points="145,81 148,83 145,83" fill="#120601" />
      <path d="M136 90 L138 94 M126 91 L127 95.5 M118 89 L116 93" stroke="#120601" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Muzzle with Sassy Asymmetrical Smirk -->
    <g class="muzzle">
      <ellipse cx="94" cy="98" rx="8.5" ry="6" fill="url(#bs-cream)" />
      <ellipse cx="106" cy="98" rx="8.5" ry="6" fill="url(#bs-cream)" />
      <!-- Petite Glossy Burgundy Button Nose -->
      <path d="M96 92 C96 89.5 104 89.5 104 92 C104 95 101 97 100 98 C99 97 96 95 96 92 Z" fill="#ba2b52" />
      <circle cx="98.5" cy="92" r="0.9" fill="#ffffff" />
      <!-- Asymmetrical Confident Smirk (curling up on the right) -->
      <path d="M96 100 Q100 101 103 99 Q107 96 110 97.5" stroke="#5c1a01" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <circle cx="110" cy="97" r="0.7" fill="#5c1a01" />
      <!-- Glossy Lower Lip Cushion -->
      <ellipse cx="102" cy="102" rx="3.5" ry="1.5" fill="#ea4875" opacity="0.65" />
      <circle cx="101" cy="102" r="0.6" fill="#ffffff" />
    </g>

    <!-- Iconic Marilyn Monroe Beauty Mark -->
    <circle cx="86" cy="101" r="1.1" fill="#321002" />
  </g>
</svg>
